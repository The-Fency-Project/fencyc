[package]
name = "fencyc"
version = "0.14.2"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
indexmap = { version = "2.13.0", features = ["serde"] }
indexset = "0.15.0"

inkwell = { version = "0.7.0", features = ["llvm21-1"] }

itertools = "0.14.0"
qbe = { path = "vendor/qbe" }
rayon = "1.11.0"
strum = "0.28.0"
strum_macros = "0.28.0"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
fs2 = "0.4"

[build-dependencies]
sha2 = "0.10"
